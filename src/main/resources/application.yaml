server:
  port: 8080

spring:
  application:
    name: binova
  datasource:
    url: jdbc:h2:file:./data/binova;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    minutos: 120
  cors:
    origens: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
  demo:
    enabled: ${BINOVA_DEMO:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: Binova Java API
    description: CitizenTech - Monitoramento de pontos de coleta
    version: '1.0'

springdoc:
  swagger-ui:
    path: /swagger-ui.html
